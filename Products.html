<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Produkty</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stretch+Pro&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="drakiel_logo_BUI.png"/>
  <style>
    @font-face {
      font-family: 'BLASTIMO SANS';
      src: url('BLASTIMO SANS.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      animation: gradientFlow 8s ease infinite;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* EKRAN BLOKADY Z HASŁEM (BLUR OVERLAY) */
    #lockOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(10, 10, 10, 0.3);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      transition: opacity 0.8s ease, visibility 0.8s ease;
      padding: 20px;
      box-sizing: border-box;
    }

    #lockOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .lock-box {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 30px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .lock-box p {
      margin-bottom: 20px;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #ccc;
      text-transform: uppercase;
    }

    .lock-box input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
      outline: none;
      margin-bottom: 12px;
    }

    .lock-box button {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .error-msg {
      color: #ff3366;
      font-size: 0.8rem;
      margin-top: 10px;
      display: none;
    }

    /* KONTENER ZAWARTOSCI - ZBLUROWANY DOMYŚLNIE */
    [data-scroll-container] {
      min-height: 100vh;
      overflow: hidden;
      filter: blur(20px);
      transition: filter 0.8s ease;
    }

    [data-scroll-container].unlocked {
      filter: blur(0px);
    }

    .home-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      color: white;
      transform: translateY(-100%);
      transition: transform 0.5s ease;
      z-index: 1000;
    }

    header.visible {
      transform: translateY(0);
    }

    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      box-sizing: border-box;
    }

    .intro {
      justify-content: center;
    }

    .main-poster-img {
      max-width: 85vw;
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    h2, h3 {
      font-size: clamp(1rem, 2vw, 2rem);
      opacity: 0;
      font-family: Bahnschrift, sans-serif;
      font-weight: normal;
      transform: translateY(80px);
      transition: opacity 2.5s ease, transform 2.5s ease;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 0 10px;
      width: 100%;
      box-sizing: border-box;
    }

    h2#subText p2 {
      display: block;
      font-size: 0.9em;
      margin-top: 0.5rem;
    }

    .logo-container {
      margin-top: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .logo-image {
      width: 120px;
      height: 120px;
      background-size: 600% 600%;
    }

    h6 {
      font-size: clamp(1.5rem, 7vw, 5.5rem);
      font-family: 'Stretch Pro', sans-serif;
      font-weight: normal;
      background: linear-gradient(270deg, #c7123a, #4a0650, #120207);
      background-size: 600% 600%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 8s ease infinite;
      margin: 0;
      padding: 100px 20px 0;
    }

    .visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .content {
      padding: 0px;
      font-size: 1.2rem;
    }

    img.fullwidth {
      display: block;
      width: 100vw;
      max-width: 100vw;
      height: auto;
      margin: 0;
      padding: 0;
    }

    p2 {
      font-weight: normal;
    }

    .BUI-img {
      width: 90vw;
      max-width: 1280px;
      height: 50vh;
      max-height: 720px;
      background-color: #ee6868;
    }

    .clouds {
      width: clamp(7vw, 12vw, 15vw);
    }

    .hover-boxes {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 40px;
      width: 100%;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .hover-box-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hover-box {
      width: 80vw;
      max-width: 520px;
      height: 80vw;
      max-height: 520px;
      background-size: cover;
      background-position: center;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .hover-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0);
      backdrop-filter: blur(0);
      transition: backdrop-filter 0.4s ease, background-color 0.4s ease;
      z-index: 1;
    }

    .hover-box:hover::before {
      backdrop-filter: blur(5px);
      background-color: rgba(0, 0, 0, 0.555);
    }

    .hover-box span {
      position: absolute;
      z-index: 2;
      color: white;
      font-family: Century Gothic, sans-serif;
      font-size: clamp(1.2rem, 4vw, 2rem);
      opacity: 0;
      transition: opacity 0.3s ease;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 90%;
    }

    .hover-box:hover span {
      opacity: 1;
    }

    .hover-label {
      margin-top: 20px;
      font-size: 1.5rem;
      font-family: Century Gothic, sans-serif;
      color: #b1b1b1;
      text-align: center;
    }

    @media (max-width: 768px) {
      .mobile-bg {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-image: url('drakielbackground167-phone.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: -1;
      }
    }
  </style>
</head>
<body>
  <div class="mobile-bg"></div>

  <!-- NAKŁADKA DO WPROWADZENIA HASŁA -->
  <div id="lockOverlay">
    <div class="lock-box">
      <p>Wprowadź hasło</p>
      <form onsubmit="checkPassword(event)">
        <input type="password" id="passInput" placeholder="••••" autocomplete="off" />
        <button type="submit">WEJDŹ</button>
      </form>
      <div id="errorMsg" class="error-msg">BŁĘDNE HASŁO</div>
    </div>
  </div>

  <header id="siteHeader">
    <a href="#" class="home-link">MANIA</a>
    <a href="index.html" class="home-link">DRAKIEL</a>
  </header>

  <div data-scroll-container id="scrollContainer">
    <!-- PIERWSZA SEKCJA Z OBRAZEM MANIA / S-TAPE PREW POSTER -->
    <section class="intro" data-scroll-section>
      <img src="S-tape prew poster.png" alt="MANIA" class="main-poster-img" />
    </section>

    <section data-scroll-section>
      <h2 id="subText">"Gdzie słowa zawodzą, tam mówi muzyka."<p2>– Hans Christian Andersen</p2></h2>
    </section>

    <section data-scroll-section>
      <h3 class="BUI-img" id="headline2">Podziemie górą</h3>
    </section>

    <section class="content" data-scroll-section>
      <p>tak tka o to chodzi</p>
      <p>lece z gangiem</p>
    </section>

    <section class="content" data-scroll-section>
      <h4>...</h4>
    </section>

    <section class="content" data-scroll-section>
      <div class="hover-boxes">
        <div class="hover-box-wrapper">
          <div class="hover-box" style="background-image: url('cd-lp.png');"><span>Więcej Informacji Wkrótce</span></div>
          <div class="hover-label">???</div>
        </div>
        <div class="hover-box-wrapper">
          <div class="hover-box" style="background-image: url('vl-lp.png');"><span>Więcej Informacji Wkrótce</span></div>
          <div class="hover-label">???</div>
        </div>
        <div class="hover-box-wrapper">
          <div class="hover-box" style="background-image: url('cd+vl+deluxse-lp.png');"><span>Więcej Informacji Wkrótce</span></div>
          <div class="hover-label">???</div>
        </div>
      </div>
    </section>

    <section class="content" data-scroll-section>
      <div class="logo-container">
        <div class="logo-image"></div>
        <h6>DDRAKIEL</h6>
      </div>
    </section>

    <section class="content" data-scroll-section>
      <div><img class="fullwidth" src="drakielbackground167upper.png" alt="tło"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.js"></script>
  <script>
    // Weryfikacja hasła MANIA
    function checkPassword(e) {
      e.preventDefault();
      const input = document.getElementById('passInput').value;
      const errorMsg = document.getElementById('errorMsg');
      const lockOverlay = document.getElementById('lockOverlay');
      const scrollContainer = document.getElementById('scrollContainer');

      if (input.trim().toUpperCase() === "MANIA") {
        lockOverlay.classList.add('hidden');
        scrollContainer.classList.add('unlocked');
      } else {
        errorMsg.style.display = 'block';
        setTimeout(() => {
          errorMsg.style.display = 'none';
        }, 2000);
      }
    }

    // Inicjalizacja Locomotive Scroll z pełną obsługą smartfonów
    const scroll = new LocomotiveScroll({
      el: document.querySelector('[data-scroll-container]'),
      smooth: true,
      smoothMobile: true,
      mobile: {
        smooth: true,
        inertia: 0.8
      },
      tablet: {
        smooth: true
      },
      touchMultiplier: 2.5,
      multiplier: 1.0,
      lerp: 0.04
    });

    const header = document.getElementById('siteHeader');
    const subText = document.getElementById('subText');
    const headline2 = document.getElementById('headline2');

    let subTextShown = false;
    let headline2Shown = false;

    scroll.on('scroll', (args) => {
      if (args.scroll.y > window.innerHeight * 0.8) {
        header.classList.add('visible');
      } else {
        header.classList.remove('visible');
      }

      if (args.scroll.y > window.innerHeight * 0.4 && !subTextShown) {
        subText.classList.add('visible');
        subTextShown = true;
      }

      if (args.scroll.y > window.innerHeight * 0.8 && !headline2Shown) {
        headline2.classList.add('visible');
        headline2Shown = true;
      }
    });

    // Aktualizacja przeliczeń przewijania po załadowaniu
    window.addEventListener('load', () => {
      scroll.update();
    });
  </script>
</body>
</html>
